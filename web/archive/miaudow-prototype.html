<title>Miaudow Đồng Lúa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: forest-dark and white bands alternate; full-bleed painted village hero; farmer path is one calm 480px column; judges get a dark instrument band with the 3D grid. Signature: the red source seal */
:root{
  --forest:#0E1E13; --forest-2:#132A1A; --forest-3:#1D4128;
  --lime:#E9BC57; --lime-2:#DCAE45; --on-lime:#1A1406; --black:#0B110C;
  --paper:#F4F0E5; --surface:#FFFFFF; --sunk:#ECE5D4;
  --ink:#16201A; --ink-2:#434A3E; --muted:#5E6555;
  --line:rgba(22,32,26,.11); --line-2:rgba(22,32,26,.22);
  --accent-ink:#7A5A12; --accent-soft:#F4E9C8;
  --straw:#B88216; --straw-soft:#FBF0D3; --straw-ink:#6E4E0C;
  --seal:#B03A26; --on-seal:#FFF7F2;
  --shadow:0 1px 2px rgba(10,30,15,.06),0 10px 26px rgba(10,30,15,.08);
  --c-rice:#D6E8C2; --c-rice-b:#5D8F3E; --c-legume:#F2E0B6; --c-legume-b:#A67A22;
  --c-maize:#F5E9A8; --c-maize-b:#9C7F0F; --c-root:#EED3C7; --c-root-b:#A45A3D; --c-other:#E6D9E7; --c-other-b:#7B5579;
  --h-rain:#3E6F9E; --h-heat:#B5482F; --h-cold:#2F7F7A; --h-drought:#B07E14;
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
.dark{
  --surface:#16301E; --sunk:#1C3A25; --ink:#F4F1E6; --ink-2:#D2CFBF; --muted:#A9AC98;
  --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.24);
  --accent-ink:#E9BC57; --accent-soft:#1F4C2C;
  --straw-soft:#3A3114; --straw-ink:#F0D08A;
  --h-rain:#8CC0EE; --h-heat:#F09173; --h-cold:#7FD6CF; --h-drought:#E9C15A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.28);
  background:var(--forest); color:var(--ink);
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--font-ui);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:12px}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
canvas{display:block}

/* preview strip + top bar */
.pnote{height:32px;line-height:32px;background:var(--black);color:#E9EFE6;font-size:13px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:var(--gut-l);padding-right:var(--gut-r)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--forest)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--forest);color:#fff}
body.home .top{position:absolute;left:0;right:0;top:calc(32px + env(safe-area-inset-top,0px));background:transparent}
.top-in{max-width:1240px;margin:0 auto;padding-block:16px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;margin-right:auto}
.brand b{font-size:19px;font-weight:500;letter-spacing:.06em}
.navpill{display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(8,26,13,.62);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow-x:auto;scrollbar-width:none;max-width:100%}
.navpill button{flex:none;min-height:40px;padding:0 16px;border-radius:999px;font-size:15px;color:rgba(255,255,255,.88);white-space:nowrap;transition:background-color .15s var(--ease),color .15s var(--ease)}
.navpill button:hover{background:rgba(255,255,255,.08)}
.navpill button[aria-pressed="true"]{background:var(--lime);color:var(--on-lime);font-weight:500}
.tools{display:flex;gap:6px;align-items:center}
.ghost{min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.28);color:#fff;font-size:14px;font-weight:500;background:rgba(8,26,13,.35)}
.ghost[aria-pressed="true"]{background:#fff;color:var(--forest)}
@media (max-width:900px){.navpill{order:3;width:100%}}

/* lime pill */
.pill{display:inline-flex;align-items:center;gap:14px;background:var(--lime);color:var(--on-lime);border-radius:999px;padding:6px 6px 6px 22px;min-height:54px;font-weight:500;font-size:17px;transition:background-color .15s var(--ease),transform .1s var(--ease);text-align:left}
.pill:hover{background:var(--lime-2)}
.pill:active{transform:scale(.985)}
.pill .arr{flex:none;width:42px;height:42px;border-radius:50%;background:var(--black);color:#fff;display:grid;place-items:center}
.pill:disabled{background:var(--sunk);color:var(--muted);cursor:not-allowed;border:1px solid var(--line-2)}
.pill:disabled .arr{background:var(--line-2)}
.pill.sm{min-height:48px;font-size:15px;padding-left:18px}.pill.sm .arr{width:36px;height:36px}
.pill.block{width:100%;justify-content:space-between}

/* bands */
.band{padding-block:72px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.band-in{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.sec-head{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px 40px;align-items:end}
.sec-head h2{font-size:clamp(30px,4.2vw,50px);line-height:1.06;font-weight:400;text-transform:uppercase;letter-spacing:-.01em}
.sec-head p{color:var(--ink-2);font-size:16px;max-width:46ch;justify-self:end}
@media (max-width:760px){.sec-head{grid-template-columns:minmax(0,1fr)}.sec-head p{justify-self:start}.band{padding-block:52px}}

/* hero */
.hx{position:relative;min-height:clamp(620px,92vh,820px);overflow:hidden;background:var(--forest);color:#fff}
.hx canvas{position:absolute;inset:0;width:100%;height:100%}
.hx-in{position:relative;max-width:1240px;min-height:inherit;margin:0 auto;padding-block:150px 64px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;align-items:center;justify-content:flex-end}
.hx-text{max-width:540px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.tag{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.4);font-size:14px;background:rgba(8,26,13,.3)}
.hx h1{font-size:clamp(38px,5.4vw,62px);line-height:1.04;letter-spacing:-.025em;font-weight:500}
.hx p{font-size:17px;color:rgba(255,255,255,.88);max-width:46ch}
@media (max-width:760px){.hx-in{align-items:flex-end;padding-top:300px}}

/* sources strip */
.strip{padding-block:22px;border-bottom:1px solid var(--line)}
.strip ul{list-style:none;margin:0 auto;padding:0;max-width:1240px;display:flex;flex-wrap:wrap;gap:14px 40px;justify-content:space-between;align-items:center}
.strip li{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;color:#fff;letter-spacing:-.01em}
.strip li svg{opacity:.9}

/* stats + photo cards */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr);gap:20px}
.photo{display:block;position:relative;border-radius:18px;overflow:hidden;background:var(--forest-2);aspect-ratio:3/4;max-width:100%}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s var(--ease),transform .9s var(--ease)}
.ph.on{opacity:1}
.stepcard:hover .ph,.gcard:hover .ph{transform:scale(1.03)}
.stepcard:hover canvas{filter:brightness(1.06)}
.hx-media{position:absolute;inset:-4%;transform:translate3d(var(--mx,0px),calc(var(--my,0px) + var(--py,0px)),0) scale(1.03);transition:transform .25s linear;will-change:transform}
.hx-veil{position:absolute;inset:0;opacity:0;transition:opacity .9s var(--ease);background:linear-gradient(180deg,rgba(10,14,6,.55),rgba(10,14,6,0) 24%),linear-gradient(90deg,rgba(14,24,12,0) 35%,rgba(14,24,12,.5) 62%,rgba(14,24,12,.82)),linear-gradient(0deg,rgba(14,30,19,.92),rgba(14,30,19,0) 22%)}
.hx:has(.has-photo) .hx-veil{opacity:1}
@media (max-width:760px){.hx-veil{background:linear-gradient(180deg,rgba(10,14,6,.55),rgba(10,14,6,0) 24%),linear-gradient(0deg,rgba(14,30,19,.97),rgba(14,30,19,.75) 45%,rgba(14,30,19,0) 75%)}}
@keyframes heroIn{from{opacity:.001;transform:translateY(16px)}to{opacity:1;transform:none}}
.hx-text>*{animation:heroIn .8s var(--ease) both}
.hx-text>*:nth-child(2){animation-delay:.08s}.hx-text>*:nth-child(3){animation-delay:.16s}.hx-text>*:nth-child(4){animation-delay:.24s}
.rv{transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.pre{opacity:0;transform:translateY(28px)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.38s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv.pre{opacity:1;transform:none}.hx-media{transform:none}}
.lite .rv.pre{opacity:1;transform:none}
.gallery{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;cursor:grab;scrollbar-width:thin;user-select:none}
.gallery.drag{cursor:grabbing;scroll-snap-type:none}
.gcard{flex:none;width:min(300px,78vw);margin:0;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px}
.gcard .photo{aspect-ratio:3/4}
.gcard figcaption{font-size:16px;color:var(--ink-2)}
.credit{font-size:13px;color:var(--muted)}
.photo canvas{width:100%;height:100%}
.photo figcaption{position:absolute;left:12px;bottom:12px;right:12px;font-size:13px;color:#fff;background:rgba(8,26,13,.55);border-radius:10px;padding:6px 10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.stats{display:flex;flex-direction:column;gap:30px;justify-content:center}
.stat b{display:block;font-size:clamp(52px,6vw,76px);font-weight:300;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:20px;margin-top:8px}
.stat small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
@media (max-width:900px){.intro{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.stats{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:24px 40px}}
@media (max-width:520px){.intro{grid-template-columns:minmax(0,1fr)}.photo{aspect-ratio:4/3}}

/* aerial */
.aerial{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:2.3/1;max-width:100%;background:var(--forest-2)}
@media (max-width:640px){.aerial{aspect-ratio:4/3}#t-start{display:none}}
.aerial canvas{width:100%;height:100%}
.aerial .center{position:absolute;inset:0;display:grid;place-items:center}
.aerial .center button{display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;font-weight:500;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.aerial .ring{width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;background:rgba(8,26,13,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background-color .15s var(--ease)}
.aerial .center button:hover .ring{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}

/* steps grid */
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 22px}
@media (max-width:640px){.steps{grid-template-columns:minmax(0,1fr)}}
.stepcard{display:flex;flex-direction:column;gap:12px;text-align:left}
.stepcard .photo{aspect-ratio:16/9}
.stepcard h3{font-size:18px;font-weight:500;display:flex;gap:10px;align-items:baseline}
.stepcard h3 span{font-family:var(--font-data);font-size:13px;color:var(--lime)}
.stepcard p{font-size:15px;color:var(--ink-2)}
.stepcard:hover h3{text-decoration:underline;text-underline-offset:4px}

/* faq */
.faq{display:flex;flex-direction:column}
.faq details{border-bottom:1px solid var(--line-2)}
.faq summary{list-style:none;min-height:64px;display:flex;align-items:center;gap:16px;cursor:pointer;font-size:18px;font-weight:500}
.faq summary::-webkit-details-marker{display:none}
.faq .q-ic{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;transition:transform .2s var(--ease),background-color .2s var(--ease)}
.faq details[open] .q-ic{background:var(--black);color:#fff;border-color:var(--black);transform:rotate(90deg)}
.faq details p{padding:0 56px 20px 0;color:var(--ink-2);max-width:70ch}

/* footer */
.foot{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:flex-start;max-width:1240px;margin:0 auto;font-size:15px;color:var(--ink-2)}
.foot .brand b{color:#fff}

/* farmer path */
.wrap{padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:28px 64px}
.col{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.screen{display:flex;flex-direction:column;gap:16px;animation:enter .26s var(--ease) both}
@keyframes enter{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.lite .screen,.lite *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.screen,*{animation:none!important;transition:none!important}}
.nav{display:flex;align-items:center;gap:12px;min-height:44px}
.back{min-height:44px;padding:0 14px 0 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font-weight:500;color:var(--ink-2)}
.back:hover{background:var(--sunk)}
.progress{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px}
.progress i{display:block;width:22px;height:6px;border-radius:3px;background:var(--line-2)}
.progress i.on{background:var(--forest-3)}
.eyebrow{color:var(--muted);font-size:15px}
.title{font-size:28px;line-height:1.2;letter-spacing:-.015em}
.lead{color:var(--ink-2)}
.mini{border-radius:22px;overflow:hidden;background:var(--forest);color:#fff;box-shadow:var(--shadow)}
.mini .cvbox{position:relative;height:230px}
.mini canvas{position:absolute;inset:0;width:100%;height:100%}
.mini-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.mini-body h1{font-size:30px;line-height:1.14;letter-spacing:-.02em}
.mini-body p{color:rgba(255,255,255,.86)}
.support{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:16px;padding:12px 14px;color:var(--ink-2);font-size:16px}
.support svg{flex:none;margin-top:3px}
.dataline{font-size:14px;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;align-items:center;gap:16px;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:14px;min-height:92px;box-shadow:var(--shadow);transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.choice:hover{border-color:var(--line-2)}
.choice[aria-pressed="true"]{border-color:var(--forest-3);background:var(--accent-soft)}
.pic{flex:none;width:64px;height:64px;border-radius:16px;background:var(--forest);display:grid;place-items:center;color:var(--lime)}
.choice b{display:block;font-size:18px;font-weight:600;line-height:1.3}
.choice span{display:block;color:var(--muted);font-size:16px;line-height:1.35;margin-top:2px}
.tick{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.choice[aria-pressed="true"] .tick{background:var(--forest-3);border-color:var(--forest-3);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .choice{flex-direction:column;align-items:flex-start;min-height:156px;position:relative}
.grid2 .tick{position:absolute;top:12px;right:12px}
.notforecast{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--straw-soft);color:var(--straw-ink);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:500}
.yeargrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ychip{min-height:44px;border-radius:12px;border:1px solid var(--line-2);font-size:15px;font-weight:500;background:var(--surface);font-variant-numeric:tabular-nums}
.ychip[aria-pressed="true"]{background:var(--forest);color:var(--lime);border-color:var(--forest)}
.yrow{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.yrow h3{font-size:20px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.yrow h3 small{font-size:14px;color:var(--muted);font-weight:400}
.hz{display:grid;grid-template-columns:118px 1fr auto;align-items:center;gap:10px;min-height:44px}
.hz-name{font-size:16px;color:var(--ink-2)}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s var(--ease)}
details.limits{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
details.limits summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:500}
details.limits ul{margin:0 0 12px;padding-left:20px;color:var(--ink-2);font-size:16px;display:flex;flex-direction:column;gap:6px}
.val{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 8px;margin:0 -4px 0 -8px;border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums;text-align:left}
.val:hover{background:var(--sunk)}
.seal{flex:none;width:20px;height:20px;border-radius:4px;background:var(--seal);color:var(--on-seal);display:grid;place-items:center;transform:rotate(-4deg)}
.srcline{display:none;font-family:var(--font-data);font-size:13px;color:var(--muted);line-height:1.4}
.officer .srcline{display:block}
.jump{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.jump button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;font-weight:500;white-space:nowrap}
.prio-tag{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--straw-ink)}
.plan{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:150px}
.plan-head{padding:18px 18px 12px;display:flex;flex-direction:column;gap:6px;background:var(--forest);color:#fff}
.plan-kicker{font-size:14px;color:rgba(255,255,255,.75);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan-kicker .usual{background:var(--lime);color:var(--on-lime);border-radius:999px;padding:1px 10px;font-weight:500}
.chain{font-size:21px;line-height:1.3;font-weight:500;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.chain .arrow{color:rgba(255,255,255,.6);font-weight:400}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:1px}
.months{padding:14px 18px}
.mbar{position:relative;height:40px;border-radius:10px;background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px);border:1px solid var(--line)}
.seg-crop{position:absolute;top:3px;bottom:3px;border-radius:7px;border-left:3px solid;display:flex;align-items:center;padding-left:6px;font-size:13px;font-weight:600;color:#0F1F14;overflow:hidden;white-space:nowrap}
.mticks{display:grid;grid-template-columns:repeat(12,1fr);font-size:13px;color:var(--muted);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums}
.bare-note{font-size:14px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:8px}
.bare-sw{width:18px;height:12px;border-radius:3px;border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--sunk) 0 3px,var(--surface) 3px 6px)}

const CS = 104, PAD = 14, HMAX = 170;
function prismHTML(c, i){
  const h = hzOf(S.hz), u = cellUnits(S.jy,S.hz,i), met = u >= h.thr, H = Math.max(3, u/h.max*HMAX), w = CS-2*PAD, flat = !S.d3 || S.lite;
  const top = met ? h.col : `color-mix(in srgb, ${h.col} 30%, #1A4529)`, side = d => `color-mix(in srgb, ${met?h.col:'#5E7A66'} ${d}%, #000)`, hh = flat ? 0 : H;
  return `<div class="prism${S.cell===i?' sel':''}" data-act="cell:${i}" tabindex="0" role="button" aria-label="${fmt(u,1)} ${h.unit[L_()]}" style="left:${c.c*CS+PAD}px;top:${c.r*CS+PAD}px;width:${w}px;height:${w}px">
    <div class="face f-side" style="left:0;top:${w}px;width:${w}px;height:${hh}px;transform-origin:top;transform:rotateX(-90deg);background:${side(72)}"></div>
    <div class="face f-side" style="left:${w}px;top:0;width:${hh}px;height:${w}px;transform-origin:left;transform:rotateY(90deg);background:${side(58)}"></div>
    <div class="face f-side" style="left:0;top:${-hh}px;width:${w}px;height:${hh}px;transform-origin:bottom;transform:rotateX(90deg);background:${side(80)}"></div>
    <div class="face f-side" style="left:${-hh}px;top:0;width:${hh}px;height:${w}px;transform-origin:right;transform:rotateY(-90deg);background:${side(66)}"></div>
    <div class="face f-top" style="transform:translateZ(${hh}px);background:${top};opacity:${0.6+0.4*c.w}"><span>${fmt(u,1)}</span></div></div>`;
}

      <div class="panel"><div class="kpi"><span class="eyebrow">${T(h.vi,h.en)} · <span class="num">${S.jy}</span></span>
        <span class="figure">${pct(share)}</span><p>${T('đất trồng Nghệ An đạt cấp độ 1 trở lên','of Nghệ An farmland reached level 1 or higher')}</p></div>
        <div class="legend"><i style="background:${h.col}"></i>${T('đạt ngưỡng','met')}<i style="background:color-mix(in srgb, ${h.col} 30%, #1A4529);border:1px solid var(--line-2)"></i>${T('chưa đạt','not met')}<span class="badge">${T('Số mẫu','Sample data')}</span></div>
        <dl class="celldetail"><dt>${T('Ô','Cell')}</dt><dd>${fmt(20-c.r*.5-.25,2)}°N ${fmt(103.75+c.c*.625+.3125,2)}°E</dd>
          <dt>${T('Đạt ngưỡng','Met')}</dt><dd>${fmt(u,1)} ${h.unit[L_()]} (${T('ngưỡng','threshold')} ${h.thr})</dd>
          <dt>${T('Đất trồng','Farmland')}</dt><dd>${pct(c.w)} ${T('trọng số','weight')} (MODIS)</dd></dl>
        <button class="pill sm" data-act="src:power" data-v="${encodeURIComponent(pct(share))}" data-l="${encodeURIComponent(T(h.vi,h.en)+' · '+S.jy)}">${T('Nguồn và giới hạn','Source and limits')}<span class="arr">${I.ur}</span></button>
      </div>
      <div class="panel"><h2>${T('Mô hình có thắng cách đoán đơn giản không?','Does the model beat simple guesses?')}</h2>
        <p class="unit">${T('Sai số trung bình khi đoán năng suất lúa xuân lệch khỏi mức bình thường, 2016–2024. Thấp hơn là tốt hơn.','Mean error when guessing how far spring rice yield lands from normal, 2016–2024. Lower is better.')}</p>
        ${modelChart()}
        <div class="gates">${[['G1',T('Đủ dữ liệu','Enough data')],['G2',T('Thắng cả B0 và BNW','Beats both B0 and BNW')],['G3',T('Ổn định khi bỏ một vùng','Stable when a region is held out')],['G4',T('Khoảng tin cậy đúng 70–90%','Interval coverage 70–90%')]].map(([g,t])=>`<div><span class="mono">${g}</span>${t}<span class="st">${T('chờ kết quả','pending')}</span></div>`).join('')}</div>
        <span class="badge">${T('Số mẫu, chờ bài kiểm tra chính','Sample values, awaiting the primary test')}</span>
      </div>
    </div>
  </div>
  <div class="panel"><h2>${T('Từ dữ liệu NASA đến con số trên điện thoại','From NASA data to the number on the phone')}</h2>
    <ol class="pipe"><li><b>NASA POWER</b>${T('Thời tiết theo ngày từ 1990, mỗi ô khoảng 50 km','Daily weather since 1990, cells of about 50 km')}</li>
    <li><b>${T('Trọng số đất trồng','Farmland weights')}</b>${T('MODIS cho biết ô nào có nhiều ruộng','MODIS tells which cells hold the fields')}</li>
    <li><b>${T('Luật của Nhà nước','Official rules')}</b>${T('Ngưỡng cấp độ rủi ro trong QĐ 18/2021','Risk-level thresholds of Decision 18/2021')}</li>
    <li><b>${T('Phần đất trồng gặp điều kiện','Share of farmland')}</b>${T('Hiện cho nông dân, kèm nguồn','Shown to the farmer, with its source')}</li></ol></div>
  </div></section>`;
}

/* ---------- real photos (photos/<name>.jpg|jpeg|png|webp beside this page), motion ---------- */
const PHOTO = { hero:'ruong-hoang-hon', mini:'bac-thang-nang', dawn:'bong-lua', rows:'non-la-thung', aerial:'bac-thang-nui-da',
  s1:'duong-ruong', s2:'dap-lua', s3:'bac-thang-gui', s4:'ganh-ma', g1:'doi-che', g2:'bac-thang-may', g3:'chum-tuong', g4:'doi-che-suong', g5:'ca-phe' };
const POS = { hero:'50% 64%', aerial:'50% 72%', mini:'50% 62%', s4:'50% 40%' };
const photoCache = {};
const findPhoto = name => photoCache[name] || (photoCache[name] = new Promise(res => { const ex = ['jpg','jpeg','png','webp'];
  const tryi = i => { if (i >= ex.length) return res(null); const im = new Image(); im.onload = () => res(im.src); im.onerror = () => tryi(i+1); im.src = `photos/${name}.${ex[i]}`; }; tryi(0); }));
function attachPhotos(){ document.querySelectorAll('canvas[data-paint]').forEach(cv => { const k = cv.dataset.paint, n = PHOTO[k]; if (!n || cv.dataset.ph) return; cv.dataset.ph = '1';
  findPhoto(n).then(src => { if (!src || !cv.isConnected) return; const img = new Image(); img.className = 'ph'; img.alt = ''; img.decoding = 'async'; img.src = src;
    if (POS[k]) img.style.objectPosition = POS[k]; cv.after(img); cv.parentElement.classList.add('has-photo'); requestAnimationFrame(() => requestAnimationFrame(() => img.classList.add('on'))); }); }); }
const calm = () => S.lite || matchMedia('(prefers-reduced-motion: reduce)').matches;
const go = fn => { if (document.startViewTransition && !calm()) document.startViewTransition(fn); else fn(); };
let io = null;
function countUp(el){ const to = +el.dataset.count, suf = el.dataset.suf || '', t0 = performance.now();
  const step = t => { const k = Math.min(1, (t-t0)/1300), e = 1-Math.pow(1-k,3); el.textContent = Math.round(to*e) + suf; if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
function setupReveal(){ if (io) io.disconnect(); if (calm() || !('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; e.target.classList.remove('pre'); io.unobserve(e.target); if (e.target.dataset.count) countUp(e.target); }), { threshold:.12 });
  document.querySelectorAll('.rv').forEach(el => { if (el.getBoundingClientRect().top > innerHeight*.92){ el.classList.add('pre'); io.observe(el); } }); }
function heroFx(){ const m = document.querySelector('.hx-media'); if (!m || calm()) return; const hx = m.parentElement;
  hx.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const r = hx.getBoundingClientRect(); m.style.setProperty('--mx', ((e.clientX-r.left)/r.width-.5)*-18+'px'); m.style.setProperty('--my', ((e.clientY-r.top)/r.height-.5)*-10+'px'); });
  hx.addEventListener('pointerleave', () => { m.style.setProperty('--mx','0px'); m.style.setProperty('--my','0px'); }); }
window.addEventListener('scroll', () => { const m = document.querySelector('.hx-media'); if (m && !calm()) m.style.setProperty('--py', Math.min(scrollY*.22, 180)+'px'); }, { passive:true });
function galleryDrag(){ const g = document.getElementById('gal'); if (!g) return; let p = null;
  g.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; p = { x:e.clientX, s:g.scrollLeft }; g.classList.add('drag'); g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove', e => { if (p) g.scrollLeft = p.s - (e.clientX - p.x); });
  const end = () => { if (!p) return; p = null; g.classList.remove('drag'); }; g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end); }
let spinRaf = 0;
function startSpin(){ cancelAnimationFrame(spinRaf); if (!S.spin || !S.d3 || calm()) return; const sc = document.getElementById('scene'); if (!sc) return; sc.style.transition = 'none';
  const f = () => { if (S.mode !== 'judge' || !S.spin || !sc.isConnected) return; S.rz += .06; sc.style.transform = `rotateX(${S.rx}deg) rotateZ(${S.rz}deg)`; spinRaf = requestAnimationFrame(f); }; spinRaf = requestAnimationFrame(f); }

/* ---------- render ---------- */
function render(){
  document.documentElement.lang = S.lang;
  document.body.classList.toggle('home', S.mode==='home');
  document.body.classList.toggle('officer', S.mode==='officer');
  document.body.classList.toggle('lite', S.lite);
  [['home',T('Trang chủ','Home')],['farmer',T('Nông dân','Farmer')],['officer',T('Cán bộ','Officer')],['judge',T('Giám khảo · 3D','Judges · 3D')]].forEach(([m,t]) => { const b = document.getElementById('m-'+m); b.textContent = t; b.setAttribute('aria-pressed', S.mode===m); });
  const lite = document.getElementById('t-lite'); lite.textContent = T('Máy yếu','Lite'); lite.setAttribute('aria-pressed', S.lite);
  document.getElementById('t-lang').textContent = S.lang==='vi' ? 'EN' : 'VI';
  document.getElementById('t-start').innerHTML = `${T('Bắt đầu','Start')}<span class="arr">${I.ur}</span>`;
  document.getElementById('pnote').textContent = T('Bản xem trước thiết kế · mọi con số là số mẫu, hình vẽ là minh họa','Design preview · every number is sample data, pictures are illustrations');
  if (S.mode==='home'){ app.innerHTML = homeHTML(); paintAll(); attachPhotos(); setupReveal(); heroFx(); galleryDrag(); return; }
  if (S.mode==='judge'){ app.innerHTML = judgeHTML(); fitStage(); bindDrag(); startSpin(); const tl = document.getElementById('tl'), on = tl && tl.querySelector('[aria-pressed="true"]'); if (on) tl.scrollLeft = on.offsetLeft - tl.clientWidth/2; return; }
  app.innerHTML = `<div class="wrap"><div class="col">${[screenStart, screenLand, screenYears, screenPrio, screenPlans][S.step]()}</div></div>`; paintAll(); attachPhotos();
}
function fitStage(){ const st = document.getElementById('stage'), fit = document.getElementById('fit'); if (!st) return;
  fit.style.transform = `scale(${Math.min(1, (st.clientWidth-24)/(4*CS+60), (st.clientHeight-40)/(3*CS+120))})`; }
function setScene(){ const sc = document.getElementById('scene'); if (sc && S.d3 && !S.lite) sc.style.transform = `rotateX(${S.rx}deg) rotateZ(${S.rz}deg)`; }
function bindDrag(){ const st = document.getElementById('stage'); if (!st) return; let p = null;
  st.addEventListener('pointerdown', e => { if (e.target.closest('button') || !S.d3 || S.lite) return; S.spin = false; cancelAnimationFrame(spinRaf); p ={x:e.clientX, y:e.clientY, rz:S.rz, rx:S.rx, moved:false}; st.setPointerCapture(e.pointerId); document.getElementById('scene').style.transition = 'none'; });
  st.addEventListener('pointermove', e => { if (!p) return; const dx = e.clientX-p.x, dy = e.clientY-p.y; if (Math.abs(dx)+Math.abs(dy) > 4) p.moved = true; S.rz = p.rz+dx*.35; S.rx = Math.max(25, Math.min(70, p.rx-dy*.25)); setScene(); });
  const end = e => { if (!p) return; const sc = document.getElementById('scene'); if (sc) sc.style.transition = ''; const moved = p.moved; p = null;
    if (!moved){ const cell = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-act^="cell:"]'); if (cell) act(cell.dataset.act, cell); } };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', () => { p = null; }); }

/* ---------- sheet ---------- */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim'); let lastFocus = null;
function openSheet(key, v, label){
  const s = SRC[key], L = L_(); lastFocus = document.activeElement;
  sheet.innerHTML = `<div class="grab"></div><div class="sheet-head"><span class="stamp">${T('NGUỒN','SOURCE')}</span>
    <div style="min-width:0"><p class="eyebrow">${label||T('Con số này','This number')}</p><h2 id="sheet-title" style="font-size:26px" class="num">${v}</h2></div>
    <button class="x" data-act="close" aria-label="${T('Đóng','Close')}">${I.close}</button></div>
    <dl class="facts"><dt>${T('Lấy từ','From')}</dt><dd>${s.name[L]}</dd><dt>${T('Loại','Kind')}</dt><dd>${s.kind[L]}</dd><dt>${T('Ở đâu','Where')}</dt><dd>${s.where[L]}</dd><dt>${T('Năm','Years')}</dt><dd>${s.years[L]}</dd><dt>${T('Ghi chú','Note')}</dt><dd>${s.read[L]}</dd></dl>
    <p class="caveat"><b>${T('Có thể không đúng khi','May not apply when')}:</b> ${s.caveat[L]}</p>`;
  sheet.classList.add('open'); scrim.classList.add('open'); sheet.setAttribute('aria-hidden','false'); sheet.querySelector('.x').focus(); }
function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('open'); sheet.setAttribute('aria-hidden','true'); if (lastFocus) lastFocus.focus(); }

/* ---------- actions ---------- */
const stopPlay = () => { if (S.playing){ clearInterval(S.playing); S.playing = null; } };
const top0 = () => window.scrollTo(0,0);
function act(a, el){
  const i = a.indexOf(':'), k = i<0 ? a : a.slice(0,i), arg = i<0 ? '' : a.slice(i+1);
  const jump = () => { document.documentElement.style.scrollBehavior = 'auto'; top0(); document.documentElement.style.scrollBehavior = ''; };
  if (k==='mode'){ stopPlay(); go(() => { S.mode = arg; render(); jump(); }); return; }
  if (k==='start'){ stopPlay(); go(() => { S.mode = 'farmer'; S.step = 1; render(); jump(); }); return; }
  if (k==='startAt'){ go(() => { S.mode = 'farmer'; S.step = +arg; if (S.step>=2 && !S.land) S.land = 'dry'; if (S.step>=4 && !S.prio) S.prio = 'water'; render(); jump(); }); return; }
  if (k==='next' || k==='back' || k==='restart'){ go(() => { if (k==='next') S.step = Math.min(4, S.step+1); else if (k==='back') S.step = Math.max(0, S.step-1); else { S.step = 0; S.land = null; S.prio = null; } render(); jump(); }); return; }
  if (k==='lang'){ S.lang = S.lang==='vi' ? 'en' : 'vi'; render(); return; }
  if (k==='lite'){ S.lite = !S.lite; render(); return; }
  if (k==='land'){ S.land = arg; render(); return; }
  if (k==='prio'){ S.prio = arg; render(); return; }
  if (k==='year'){ const y = +arg, sy = window.scrollY; S.years = S.years.includes(y) ? S.years.filter(x=>x!==y) : [...S.years, y]; render(); window.scrollTo(0,sy); return; }
  if (k==='jump'){ document.getElementById('plan-'+arg)?.scrollIntoView({behavior:S.lite?'auto':'smooth', block:'start'}); return; }
  if (k==='src'){ openSheet(arg, decodeURIComponent(el.dataset.v||''), decodeURIComponent(el.dataset.l||'')); return; }
  if (k==='close'){ closeSheet(); return; }
  if (k==='share'){ const old = el.innerHTML; el.innerHTML = I.check + T('Đã chép đường link thẻ','Card link copied'); try { navigator.clipboard?.writeText(location.href.split('#')[0]).catch(()=>{}); } catch(e){} setTimeout(() => { el.innerHTML = old; }, 1600); return; }
  if (k==='hz'){ S.hz = arg; render(); return; }
  if (k==='jy'){ S.jy = +arg; render(); return; }
  if (k==='cell'){ S.cell = +arg; render(); return; }
  if (k==='rot'){ S.spin = false; cancelAnimationFrame(spinRaf); const sc = document.getElementById('scene'); if (sc) sc.style.transition = ''; S.rz += (+arg)*30; setScene(); return; }
  if (k==='d3'){ S.d3 = !S.d3; render(); return; }
  if (k==='play'){ if (S.playing){ stopPlay(); render(); return; } S.playing = setInterval(() => { S.jy = S.jy>=2024 ? 1995 : S.jy+1; render(); }, 1100); render(); return; }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; if (b.dataset.act.startsWith('cell:') && b.closest('#stage')) return; act(b.dataset.act, b); });
document.addEventListener('keydown', e => { if (e.key==='Escape' && sheet.classList.contains('open')) closeSheet();
  const c = e.target.closest?.('[data-act^="cell:"]'); if (c && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); act(c.dataset.act, c); } });
let rz; window.addEventListener('resize', () => { fitStage(); clearTimeout(rz); rz = setTimeout(paintAll, 180); });
render();
})();
</script>
