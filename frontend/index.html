<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1E13" />
    <meta
      name="description"
      content="Miaudow: so sánh các cách trồng trên đất lúa thiếu nước ở Nghệ An, với 30 năm thời tiết NASA và số liệu có nguồn."
    />
    <link rel="icon" type="image/png" sizes="48x48" href="./brand/icon-48.png" />
    <link rel="apple-touch-icon" href="./brand/icon-180.png" />
    <!-- No image preload: with hash routing there is one HTML file for every route, so a preload would compete for
         bandwidth on all pages (measured: every route got slower on the field-phone profile). -->
    <title>Miaudow · Đồng lúa Nghệ An</title>
    <!-- the loading line is drawn before the stylesheet arrives (vite.config.ts lateStylesheet), so its few rules
         sit here: the page colours of tokens.css for the device's light or dark setting -->
    <style>
      body {
        margin: 0;
        background: #0b1a12;
      }
      .boot {
        margin: 0;
        padding: 40vh 1rem 0;
        text-align: center;
        font:
          17px/1.6 system-ui,
          sans-serif;
        color: #dfe5d9;
      }
      .boot span {
        display: block;
        color: #b7c2b2;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f1f3ee;
        }
        .boot {
          color: #2f3a32;
        }
        .boot span {
          color: #525d55;
        }
      }
    </style>
  </head>
  <body>
    <!-- shown until the app starts on a slow phone (audit F3, D-187); React replaces it, no script needed -->
    <div id="root">
      <p class="boot">Đang tải trang, xin chờ…<span lang="en">Loading the page, please wait…</span></p>
    </div>
    <noscript>Miaudow cần JavaScript để chạy. / Miaudow needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
