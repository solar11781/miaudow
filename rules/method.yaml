# explain_terms: the six entries of UI-UX-SPEC §11b item 3, in ExplainKey order.
explain_terms:
  - key: evapotranspiration
    title: {vi: "Bốc thoát hơi nước", en: "Evapotranspiration"}
    text: {vi: "Nước rời khỏi đất và cây dưới dạng hơi. Không con số nào trong ứng dụng dùng đại lượng này.",
           en: "Water that leaves the soil and the plants as vapour. No number in this app uses it."}
    source_ids: [R-M01]
  - key: soil_moisture
    title: {vi: "Độ ẩm đất", en: "Soil moisture"}
    text:
      vi: "Độ ẩm vùng rễ (GWETROOT) của MERRA-2 là giá trị mô hình, không phải số đo. Mô hình dùng nó làm đầu vào; thẻ
        phương án hiển thị nó bên cạnh trung bình 1991-2020."
      en: "Root-zone wetness (GWETROOT) from MERRA-2 is a model value, not a measurement. The model uses it as an
        input; the plan cards show it next to its 1991-2020 average."
    source_ids: [R-W12, R-N01]
  - key: ndvi
    title: {vi: "Chỉ số thực vật (NDVI)", en: "Vegetation index (NDVI)"}
    text:
      vi: "NDVI được tính từ ánh sáng nhìn thấy và ánh sáng cận hồng ngoại mà cây phản xạ. Không dùng: tín hiệu cây
        trồng trong vụ sẽ làm lộ kết quả vào đầu vào của mô hình."
      en: "NDVI is calculated from the visible and near-infrared light reflected by vegetation. Not used: an in-season
        vegetation signal would leak the outcome into the model inputs."
    source_ids: [R-N08]  # D-165: NASA's NDVI definition page
  - key: frost
    title: {vi: "Sương muối", en: "Frost"}
    text:
      vi: "Không xét: Quyết định 18/2021/QĐ-TTg Điều 5.19 chỉ định nghĩa sương muối bằng lời; báo chí nói về sương muối
        ở các xã vùng núi cao, không phải trên đất lúa vùng thấp mà ứng dụng nói đến."
      en: "Not covered: Decision 18/2021/QD-TTg Art. 5.19 defines frost in words only; news reports frost in high
        mountain communes, not on the lowland rice land this app is about."
    source_ids: [R-A01, R-A18]
  - key: water_balance
    title: {vi: "Cân bằng nước", en: "Water balance"}
    text:
      vi: "Không tính: chỉ số nước đã công bố không thể tính lại từ bài báo nếu chúng tôi không tự thêm các lựa chọn của
        mình."
      en: "Not computed: the published water index could not be rebuilt from its paper without choices of our own."
    source_ids: [R-M03]
  - key: data_types
    title: {vi: "Các loại số liệu", en: "Kinds of data"}
    text:
      vi: "Số liệu ngày của NASA POWER lấy từ tái phân tích MERRA-2. GPM IMERG Final kết hợp ước tính từ vệ tinh với
        phân tích mưa đo ở trạm của GPCC; chỉ dùng cho phần kiểm tra mưa trên trang này. Không dùng số liệu trạm. Giá
        trị theo ô lưới làm mờ các giá trị cực đoan."
      en: "NASA POWER daily values come from the MERRA-2 reanalysis. GPM IMERG Final combines satellite estimates with
        the GPCC rain-gauge analysis; it is used only for the rain check on this page. No station data is used.
        Gridded values smooth extremes."
    source_ids: [R-N01, R-W12, R-N05, R-A10]

# datasets_not_used: UI-UX-SPEC §11b item 4b (D-165): the dataset, its official facts and why it is not used, from the
# planning research/datasets-considered.md (dates from NASA CMR, R-N07).
datasets_not_used:
  - dataset: ECOSTRESS
    reason:
      vi: "Nhiệt độ và độ phát xạ bề mặt đất, toàn cầu 70 m, số liệu từ ngày 9/7/2018. Không dùng: bắt đầu từ năm 2018,
        quá ngắn cho các năm đã qua 1995-2024 và cho các năm huấn luyện trước 2016."
      en: "Land surface temperature and emissivity, global 70 m, data from 9 July 2018. Not used: it starts in 2018, too
        short for the past years 1995-2024 and for the training years before 2016."
    source_ids: [R-N07]
  - dataset: Landsat
    reason:
      vi: "Phản xạ bề mặt Level-2 Collection 2 từ ngày 22/8/1982; HLS Landsat 30 m từ ngày 11/4/2013. Không dùng: phản
        xạ của cây và NDVI là tín hiệu cây trồng trong vụ, sẽ làm lộ kết quả vào đầu vào của mô hình; không con số nào
        trong ứng dụng cần đến chúng."
      en: "Level-2 surface reflectance Collection 2 from 22 August 1982; HLS Landsat 30 m from 11 April 2013. Not used:
        vegetation reflectance and NDVI are in-season crop signals that would leak the outcome into the model inputs;
        no number in this app needs them."
    source_ids: [R-N07]
  - dataset: VIIRS
    reason:
      vi: "Chỉ số thực vật VIIRS/NPP 16 ngày, toàn cầu 500 m, từ ngày 17/1/2012. Không dùng: tín hiệu cây trồng trong vụ
        sẽ làm lộ kết quả vào đầu vào của mô hình; bắt đầu từ năm 2012."
      en: "VIIRS/NPP vegetation indices, 16-day, global 500 m, from 17 January 2012. Not used: an in-season crop signal
        would leak the outcome into the model inputs; it starts in 2012."
    source_ids: [R-N07]
  - dataset: Sentinel-2 (ESA)
    reason:
      vi: "Có trong NASA HLS Sentinel-2 30 m từ ngày 28/11/2015. Không dùng: tín hiệu cây trồng trong vụ sẽ làm lộ kết
        quả vào đầu vào của mô hình; bắt đầu từ năm 2015."
      en: "Available as NASA HLS Sentinel-2 30 m from 28 November 2015. Not used: an in-season crop signal would leak the
        outcome into the model inputs; it starts in 2015."
    source_ids: [R-N07]
  - dataset: GLDAS
    reason:
      vi: "Mô hình bề mặt đất Noah 0,25 độ: phiên bản 2.0 từ 1/1/1948 đến 31/12/2014, phiên bản 2.1 từ 1/1/2000. Không
        dùng: đây là một mô hình giống MERRA-2 mà NASA POWER đã cho chúng tôi; mô hình thứ hai không phải là phép kiểm
        tra bằng số đo, và cần hai phiên bản mới phủ được 1995-2024."
      en: "Noah land-surface model, 0.25 degree: version 2.0 from 1 January 1948 to 31 December 2014, version 2.1 from 1
        January 2000. Not used: it is a model like MERRA-2, which NASA POWER already gives us; a second model is not a
        measured check, and two versions would be needed to cover 1995-2024."
    source_ids: [R-N07, R-N01]
  - dataset: GRACE / GRACE-FO
    reason:
      vi: "Các khối mascon trên lưới diện tích bằng nhau 3 độ, từ ngày 4/4/2002. Không dùng: một khối 3 độ lớn hơn cả
        vùng của năm ô lưới NASA POWER ở Nghệ An; bắt đầu từ năm 2002."
      en: "Mascons on an equal-area 3-degree grid, from 4 April 2002. Not used: one 3-degree mascon is larger than the
        area of the five NASA POWER cells of Nghệ An; it starts in 2002."
    source_ids: [R-N07, R-N01]
  - dataset: GEDI
    reason:
      vi: "GEDI đo chính xác chiều cao tán rừng, cấu trúc theo chiều đứng của tán và độ cao bề mặt; số liệu từ ngày
        4/4/2019. Không dùng: nó đo cấu trúc rừng, không đo cây trồng; bắt đầu từ năm 2019."
      en: "GEDI makes precise measurements of forest canopy height, canopy vertical structure and surface elevation;
        data from 4 April 2019. Not used: it measures forest structure, not crops; it starts in 2019."
    source_ids: [R-N07, R-N10]
  - dataset: FAO GAEZ
    reason:
      vi: "Các lớp bản đồ thích nghi nông nghiệp - khí hậu toàn cầu, có trong thẻ Resources của thử thách. Không dùng:
        các phương án của chúng tôi lấy từ một thử nghiệm đồng ruộng trên đúng loại đất này; một mô hình thích nghi toàn
        cầu không phải bằng chứng tại chỗ; điều khoản sử dụng chưa được kiểm tra."
      en: "Global agro-climatic suitability layers, listed on the challenge Resources tab. Not used: our plans come from
        a field trial on this land type; a global suitability model is not local evidence; its terms of use were not
        checked."
    source_ids: [R-H16, R-P02]
  - dataset: ERA5 (ECMWF)
    reason:
      vi: "Tái phân tích thế hệ thứ năm của ECMWF, số liệu từ năm 1940, lưới kinh vĩ 0,25 độ. Không dùng: một tái phân
        tích thứ hai bên cạnh MERRA-2 của NASA POWER không phải là phép kiểm tra bằng số đo; số liệu NASA vẫn là phần
        cốt lõi của dự án."
      en: "The fifth generation ECMWF reanalysis, data from 1940, a 0.25-degree latitude-longitude grid. Not used: a
        second reanalysis next to NASA POWER's MERRA-2 is not a measured check; NASA data stays the core of this
        project."
    source_ids: [R-N09, R-N01, R-H12]

# limitations: one line each (UI-UX-SPEC §11b item 5): 03-ML-SPEC §9 and the spell rule of 03-ML-SPEC §5a.
limitations:
  - {vi: "Thời tiết của tỉnh lấy từ các ô lưới tái phân tích lớn, có trọng số theo đất trồng trọt; giá trị theo ô lưới làm mờ các giá trị cực đoan.",
     en: "Province weather comes from large reanalysis grid cells weighted by farmland; gridded values smooth extremes."}
  - {vi: "Trọng số đất trồng trọt lấy từ một bản đồ cố định, nên không theo kịp thay đổi sử dụng đất về sau.",
     en: "Farmland weights come from one fixed farmland map, so they miss later land-cover change."}
  - {vi: "Các năng suất của nhiều tỉnh gần nhau tương quan với nhau, làm cỡ mẫu trông lớn hơn thực tế; phép lấy mẫu lại theo năm xử lý điều này.",
     en: "Yields of nearby provinces move together, which makes the sample look larger than it is; the year bootstrap handles this."}
  - {vi: "Các lựa chọn đưa ra sau khi xem số liệu 1995-2024 (quy tắc làm sạch, bộ lọc diện tích) được nêu ra và cố định trước lần chạy mô hình đầu tiên.",
     en: "Choices made after looking at the 1995-2024 data (cleaning rules, the area filter) are stated and fixed before the first model run."}
  - {vi: "Năng suất bình thường ước tính gần các điểm gãy của chuỗi (tách tỉnh năm 2004, Hà Tây năm 2008) có thể tạo ra độ lệch giả.",
     en: "The normal yield fitted near breaks in a series (the 2004 province splits, Hà Tây in 2008) can create false anomalies."}
  - {vi: "Cửa sổ mùa vụ lấy từ một lịch thời vụ quốc gia (năm 2019) và khác nhau giữa các tỉnh.",
     en: "Season windows come from one national crop calendar (2019) and vary by province."}
  - {vi: "Độ nhạy của cả vùng không phải là độ nhạy của một ruộng.",
     en: "A region's sensitivity is not a farm's sensitivity."}
  - {vi: "Thay đổi địa giới hành chính trong quá khứ (Hà Tây năm 2008; sắp xếp năm 2025) có thể làm ghép số liệu sai.",
     en: "Past administrative changes (Hà Tây in 2008; the 2025 restructuring) can corrupt data joins."}
  - {vi: "Lúa của tỉnh phần lớn là lúa có tưới, nên độ nhạy của cả vùng có thể thấp hơn độ nhạy của đất thường xuyên khô hạn.",
     en: "Provincial rice is mostly irrigation-served, so regional sensitivity can understate the sensitivity of drought-prone land."}
  - {vi: "Quyết định không xếp loại các đợt nắng nóng hoặc rét hại có các ngày nằm ở nhiều khoảng nhiệt độ khác nhau, nên chúng tôi không tính các đợt như vậy; một chuỗi ngày đủ điều kiện nằm trong một khoảng nhiệt độ vẫn được tính, kể cả khi nó nằm trong một đợt dài hơn.",
     en: "The decision does not classify heat or cold spells whose days fall in different temperature bands, so we do not count such spells; a run of days inside one band that meets its rule still counts, also inside a longer spell."}

# stability_scope: the card scope text (03-ML-SPEC §5b; UI-UX-SPEC §11 Stability.scope), no number.
stability_scope: {vi: "Trung bình của tỉnh; phần lớn là lúa có tưới", en: "Province average; mostly irrigation-served rice"}

# season_labels: per season code (UI-UX-SPEC §11 season codes): P-02 Tables 9, 1, 5 name vụ Đông Xuân, vụ Hè Thu and
# vụ Thu Đông (R-P02); the NSO rice seasons are spring, autumn and winter (R-D01).
season_labels:
  spring: {label: {vi: "Vụ Đông Xuân", en: "Spring season"}, source_ids: [R-P02, R-D01]}
  summer_autumn: {label: {vi: "Vụ Hè Thu", en: "Summer-autumn season"}, source_ids: [R-P02, R-D01]}
  winter: {label: {vi: "Vụ Mùa", en: "Winter season"}, source_ids: [R-D01]}
  autumn_winter: {label: {vi: "Vụ Thu Đông", en: "Autumn-winter season"}, source_ids: [R-P02]}
