<title id="grid-figure-title">NASA POWER weather cells over Nghe An, shaded by farmland weight</title>
<desc id="grid-figure-desc">The Nghe An boundary drawn over the 10 NASA POWER cells that hold the province's MODIS land pixels. Farmland weight of each cell, by its centre: 18.5 N, 105.625 E: 0.20; 19.0 N, 105.0 E: 0.14; 19.0 N, 105.625 E: 0.47; 19.5 N, 105.0 E: 0.04; 19.5 N, 105.625 E: 0.16; cells with farmland weight 0: 18.5 N, 105.0 E; 19.0 N, 104.375 E; 19.5 N, 103.75 E; 19.5 N, 104.375 E; 20.0 N, 105.0 E; Sources: NASA POWER cells of 0.5 x 0.625 degrees. Farmland weights from NASA MODIS land cover MCD12C1 with the fixed farmland mask. Boundary: geoBoundaries gbOpen VNM ADM1 (Runfola et al. 2020). Drawn as plain longitude and latitude, longitude scaled by cos(latitude) at the middle latitude; no base map. Weights rounded to 2 decimals, so the printed values may not sum to exactly 1.</desc>
