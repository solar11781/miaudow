# Secret scan settings: gitleaks' default rules plus one narrow exception.
# The artifacts name each plan crop by its UI-UX-SPEC crop key (for example "cc1_spring_peanut", "usual_p03_spring_rice");
# the generic API key rule reads `"crop_key": "<plan>_<season>_<crop>"` as a key, also unquoted in YAML before an
# optional CRLF line end, so only that key format is allowed, quotes in pairs, for that rule only; the crop part holds
# only lower case letters and underscores.

[extend]
useDefault = true

[[allowlists]]
description = "UI-UX-SPEC crop keys in artifacts, not secrets"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''^crop_key("?\s*:\s*"(usual|usual_p03|cc[1-4])_(spring|summer_autumn|autumn_winter)_[a-z_]+"|\s*:\s*(usual|usual_p03|cc[1-4])_(spring|summer_autumn|autumn_winter)_[a-z_]+)\r?$''']
