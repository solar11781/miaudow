# CI gates for every pull request into main (D-123, D-124). Linux only, cached, cancelled when superseded,
# to stay inside the free Actions minutes of a private repository. Expected layout: Python at the repository root
# (pyproject.toml, requirements*.lock, src/, tests/), frontend in frontend/.
name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  RUFF_VERSION: "0.17.4"
  PYTEST_VERSION: "8.3.5"
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_VERSION: "8.30.1"
  # the linux_x64 line of gitleaks_8.30.1_checksums.txt in the v8.30.1 release
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      python: ${{ steps.detect.outputs.python }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          files=$(git diff --name-only "$base"...HEAD || git ls-files)
          echo "$files"
          all=false; echo "$files" | grep -q '^\.github/' && all=true
          py=false; echo "$files" | grep -v '^frontend/' | grep -qE '\.(py|toml|lock|cfg|ini|yaml|yml|json|csv)$' && py=true
          # the stale-snapshot test (tests/test_build_snapshot.py) must run when only the saved answers change
          echo "$files" | grep -q '^frontend/snapshot/' && py=true
          fe=false; echo "$files" | grep -q '^frontend/' && fe=true
          [ -f pyproject.toml ] || py=false
          [ -f frontend/package.json ] || fe=false
          [ "$all" = true ] && [ -f pyproject.toml ] && py=true
          [ "$all" = true ] && [ -f frontend/package.json ] && fe=true
          echo "python=$py" >> "$GITHUB_OUTPUT"
          echo "frontend=$fe" >> "$GITHUB_OUTPUT"

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: safety hook and allow-list checker tests
        run: node --test .claude/hooks/guard.test.mjs .github/scripts/check-deps.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # the python job is skipped until pyproject.toml exists; these checks must run on every pull request
      - name: tooling python tests (architecture, source trace, attribution)
        run: |
          pip install "pytest==${PYTEST_VERSION}"
          pytest -q tests/test_architecture.py tests/test_source_trace.py tests/test_attribution.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (whole history)
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # throwaway PostgreSQL 18, as the Railway database image, for tests/test_accounts.py; never the Railway database
    services:
      postgres:
        # exact patch version and digest (Docker Hub, read 2026-11-14), as the Dockerfile pins its base image
        image: postgres:18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install -r requirements-dev.lock "ruff==${RUFF_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"
      - name: lint
        run: ruff check .
      - name: format
        run: ruff format --check .
      - name: tests
        run: pytest -q
      - name: dependency audit
        run: pip-audit -r requirements.lock

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: dependency allow-list
        run: node ../.github/scripts/check-deps.mjs package.json
      - run: npm ci
      - name: lint
        run: npx eslint .
      - name: format
        run: npx prettier --check .
      - name: type check
        run: npm run typecheck
      - name: unit tests
        run: npx vitest run
      - name: build
        run: npm run build
      # the saved snapshot ships only in the offline demo build (04-TECH-DESIGN section 9), never in the deployed one
      - name: snapshot not in the deployed build
        run: test ! -e dist/snapshot
      - name: dependency audit (shipped packages)
        run: npm audit --omit=dev --audit-level=high
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}
      # the browser tests run against the FastAPI server serving frontend/dist; sign-in stays off (no GOOGLE_CLIENT_ID)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: backend for the browser tests
        working-directory: .
        run: pip install -r requirements.lock && pip install --no-deps .
      - name: browser tests (360 x 740)
        run: npx playwright install --with-deps chromium && npx playwright test
      # builds dist-snapshot and serves it statically, with no backend, as on demo day
      - name: browser tests of the offline demo build (360 x 740)
        run: npx playwright test -c playwright.snapshot.config.ts && test -f dist-snapshot/snapshot/index.json
